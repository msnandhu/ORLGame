<!doctype html>
<html lang="en">
<head><meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1" /><title>OFF-ROAD LEGENDS · Showroom</title>
<style>html,body{margin:0;height:100%;background:#9fb3c2;overflow:hidden;font-family:system-ui,sans-serif}canvas{width:100%;height:100%;display:block;outline:none}
#bar{position:fixed;left:0;right:0;bottom:0;display:flex;gap:6px;flex-wrap:wrap;justify-content:center;padding:10px;background:linear-gradient(transparent,rgba(0,0,0,.55))}
#bar button{font:600 13px system-ui;padding:8px 12px;border-radius:8px;border:1px solid rgba(255,255,255,.35);background:rgba(20,24,28,.7);color:#fff;cursor:pointer}
#bar button.on{background:#e07a1f;border-color:#e07a1f}#name{position:fixed;top:14px;left:0;right:0;text-align:center;color:#fff;font:700 22px system-ui;text-shadow:0 2px 8px rgba(0,0,0,.6)}
#name small{display:block;font:500 13px system-ui;opacity:.85;margin-top:4px}</style></head>
<body><canvas id="c"></canvas><div id="name"></div><div id="bar"></div>
<script type="module" src="/src/showroom.ts"></script></body></html>
